server {
  listen 5173;
  server_name _;

  # Static frontend assets
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy API calls to the chatbot service.
  # Disable buffering so SSE streams flow through to the client.
  location /api/ {
    proxy_pass http://chatbot:3001;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_read_timeout 600;
  }

  location / {
    try_files $uri /index.html;
  }
}
