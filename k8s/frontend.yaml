apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: llm-logger }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 5173, targetPort: 5173, nodePort: 30573 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: llm-logger }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: llm-logger/frontend:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5173 }]
