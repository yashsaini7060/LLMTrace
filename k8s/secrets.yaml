# Replace these dummy values before applying.
apiVersion: v1
kind: Secret
metadata:
  name: llm-logger-secrets
  namespace: llm-logger
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  POSTGRES_PASSWORD: "llm"
  INGESTION_TOKEN: "dev-ingestion-token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-logger-config
  namespace: llm-logger
data:
  POSTGRES_USER: "llm"
  POSTGRES_DB: "llm_logs"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://redis:6379"
  INGESTION_URL: "http://ingestion:4000"
  LOG_STREAM: "inference.logs"
  DEFAULT_MODEL: "anthropic:claude-3-5-sonnet-latest"
