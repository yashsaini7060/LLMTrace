apiVersion: v1
kind: Service
metadata: { name: ingestion, namespace: llm-logger }
spec:
  selector: { app: ingestion }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ingestion, namespace: llm-logger }
spec:
  replicas: 2
  selector: { matchLabels: { app: ingestion } }
  template:
    metadata: { labels: { app: ingestion } }
    spec:
      containers:
        - name: ingestion
          image: llm-logger/ingestion:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: llm-logger-config }
            - secretRef:    { name: llm-logger-secrets }
          ports: [{ containerPort: 4000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 4000 }
            initialDelaySeconds: 3
            periodSeconds: 5
