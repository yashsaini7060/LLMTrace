apiVersion: v1
kind: Service
metadata: { name: chatbot, namespace: llm-logger }
spec:
  selector: { app: chatbot }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: chatbot, namespace: llm-logger }
spec:
  replicas: 2
  selector: { matchLabels: { app: chatbot } }
  template:
    metadata: { labels: { app: chatbot } }
    spec:
      containers:
        - name: chatbot
          image: llm-logger/chatbot:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: llm-logger-config }
            - secretRef:    { name: llm-logger-secrets }
          ports: [{ containerPort: 3001 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 5
